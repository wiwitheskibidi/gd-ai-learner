name: Build GD AI Learner APK

on:
  workflow_dispatch:
  push:

jobs:
  mod:
    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Android32]
    name: Mod (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          path: mod
          sdk: v5.11.2
          bindings: geode-sdk/bindings
          bindings-ref: 1012fcb37243286184d319404b15fd929098fd47
          combine: true
          target: ${{ matrix.target }}

  combine:
    name: Combine mod builds
    runs-on: ubuntu-latest
    needs: mod
    outputs:
      dir: ${{ steps.build.outputs.build-output }}
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mod
          path: ${{ steps.build.outputs.build-output }}

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: combine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ai-mod
          path: mod
          sdk: v5.11.2
          bindings: geode-sdk/bindings
          bindings-ref: 1012fcb37243286184d319404b15fd929098fd47-out

      - name: Bundle mod into the APK
        run: |
          find mod-out -name '*.geode' -exec cp {} app/src/main/assets/mods/ \;
          ls -la app/src/main/assets/mods
          test -n "$(ls app/src/main/assets/mods/*.geode)"

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build (debug-signed, installs directly)
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleStandardDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk gd-ai-learner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gd-ai-learner-apk
          path: gd-ai-learner.apk
